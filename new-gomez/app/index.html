<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>TuBarbería · Panel</title>
<meta name="description" content="Agenda, clientes, caja y reportes de tu barbería en un solo lugar."/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#F5F3EE"/>
<meta name="color-scheme" content="light dark"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png"/>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="TuBarbería"/>
<meta name="format-detection" content="telephone=no"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="app.css"/>
<script>
  // Tema antes de pintar (evita parpadeo claro→oscuro).
  try { var t = localStorage.getItem('tb:theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<div id="splash" class="splash" role="status" aria-label="Cargando">
  <div class="splash-mark">
    <span class="logo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2.5a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3z" fill="currentColor"/><path d="M7 21h10v-2.5a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3z" fill="currentColor"/><path d="M9 8.5 15 15.5M15 8.5 9 15.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></span>
    <span class="brandname">Tu<b>Barbería</b></span>
    <div class="spinner"></div>
  </div>
</div>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Activa JavaScript para usar el panel de TuBarbería.</p></noscript>
<script type="module" src="main.js"></script>
<script nomodule>document.getElementById('splash').innerHTML='<p style="padding:24px;font-family:sans-serif;text-align:center">Tu navegador es muy antiguo para el panel. Actualízalo o usa Chrome/Safari recientes.</p>';</script>
</body>
</html>
