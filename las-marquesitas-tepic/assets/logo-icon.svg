<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Las Marquesitas Tepic">
  <circle cx="100" cy="100" r="98" fill="#000"/>
  <circle cx="113" cy="85" r="37" fill="#fff"/>
  <!-- cone silhouette blocks the moon so the white linework always reads on black -->
  <path d="M120,45 L158,33 L78,128 L65,140 Z" fill="#000"/>
  <!-- cone outline -->
  <path d="M120,45 L65,140 M158,33 L78,128" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M120,45 L158,33" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M78,128 L65,140" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
  <g stroke="#fff" stroke-width="2.4" stroke-linecap="round">
    <line x1="65" y1="140" x2="90" y2="113.75"/>
    <line x1="78" y1="128" x2="73.25" y2="125.75"/>
    <line x1="73.25" y1="125.75" x2="106" y2="94.75"/>
    <line x1="90" y1="113.75" x2="84.25" y2="106.75"/>
    <line x1="84.25" y1="106.75" x2="122" y2="75.75"/>
    <line x1="106" y1="94.75" x2="95.25" y2="87.75"/>
    <line x1="95.25" y1="87.75" x2="138" y2="52.75"/>
    <line x1="122" y1="75.75" x2="106.25" y2="68.75"/>
    <line x1="106.25" y1="68.75" x2="154" y2="37.75"/>
    <line x1="138" y1="52.75" x2="117.25" y2="49.75"/>
  </g>
  <!-- cheese pull: strings stretching off the fresh wafer -->
  <g fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round">
    <path d="M120,44 C124,36 130,29 136,26"/>
    <line x1="138" y1="38" x2="140" y2="20"/>
    <line x1="145" y1="36" x2="150" y2="21"/>
    <line x1="152" y1="35" x2="156" y2="23"/>
  </g>
</svg>
