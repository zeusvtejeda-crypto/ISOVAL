<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>BeautySkin CRM · Ventas y clientes</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#0A2638"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="../assets/logo.svg"/>
<link rel="apple-touch-icon" href="../assets/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="BeautySkin"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#0A2638;--ink2:#23465A;--rose:#C49A4A;--rose2:#9C7430;--blush:#F5E6DF;--cream:#FBF6F2;--gold:#C49A4A;--muted:#7D8790;--line:rgba(10,38,56,.12);--ok:#3E8E5E;--warn:#C7862E;--bad:#B5484B;--card:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font:400 15px/1.5 'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--ink);color:#E9DEDF;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .logo{font:600 24px 'Cormorant Garamond';color:#fff;padding:0 10px 4px;display:flex;gap:10px;align-items:center}aside .logo img{width:40px;height:40px}
aside .logo small{display:block;font:400 10px 'Jost';letter-spacing:3px;text-transform:uppercase;color:#BBAEB0}
aside nav{display:flex;flex-direction:column;gap:2px;margin-top:16px}
aside nav button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center;color:#E9DEDF}
aside nav button.on{background:rgba(255,255,255,.1);color:#fff}
aside nav button .c{margin-left:auto;background:var(--rose);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
aside .me{margin-top:auto;font-size:13px;color:#BBAEB0;padding:10px}
aside .me button{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;margin-top:6px}
main{padding:24px clamp(16px,3vw,36px) 100px;max-width:1200px;width:100%}
main.still>*,main.still .li,main.still .k4>.card,main.still tbody tr,main.still .cl{animation:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:34px}
.top p{color:var(--muted)}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;z-index:30;flex-direction:row;padding:6px calc(6px + env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom))}aside .logo,aside .me{display:none}aside nav{flex-direction:row;margin:0;width:100%;justify-content:space-around}aside nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px}aside nav button .c{position:absolute;margin:0 0 0 18px;font-size:9px}main{padding-bottom:110px}}
.ico{width:20px;height:20px;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.r{background:var(--rose);color:#fff;border-color:var(--rose)}
.btn.s{padding:6px 12px;font-size:13px}
.btn.wa{background:#25D366;color:#fff;border-color:#25D366}
.btn.d{color:var(--bad)}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.c2{grid-template-columns:1.3fr 1fr}
@media(max-width:980px){.c2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h3{font-size:22px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi small{color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.kpi b{display:block;font:600 32px 'Cormorant Garamond';margin-top:2px}
.kpi span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .t{font-weight:600;min-width:52px;color:var(--rose2)}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:500}
.li .m span{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--blush);color:var(--ink2);text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.pill.pendiente{background:#FBEFD9;color:var(--warn)}.pill.confirmada{background:#E3F0E7;color:var(--ok)}.pill.atendida{background:#E8E2F2;color:#6B568F}.pill.cancelada,.pill.no-show{background:#F6E0E0;color:var(--bad)}
.empty{color:var(--muted);padding:14px 0;text-align:center}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--cream)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rose);border-color:transparent}
label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.search{max-width:320px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
/* POS */
.pos{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
@media(max-width:980px){.pos{grid-template-columns:1fr}}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.prod:hover{border-color:var(--rose)}
.prod b{font-weight:500;line-height:1.25}
.prod span{margin-top:auto;font:600 19px 'Cormorant Garamond'}
.prod small{color:var(--muted);font-size:11px}
.cart{position:sticky;top:16px}
.cl{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:center}
.cl .q{display:flex;gap:4px;align-items:center}
.cl .q button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer}
.tot{display:flex;justify-content:space-between;font:600 28px 'Cormorant Garamond';margin:12px 0}
/* calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto}
.wd{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;min-height:140px}
.wd.today{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose)}
.wd h4{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.ev{background:var(--blush);border-radius:8px;padding:6px 8px;font-size:12px;margin-bottom:6px;cursor:pointer;border-left:3px solid var(--rose)}
.ev.confirmada{border-color:var(--ok)}.ev.atendida{opacity:.6;border-color:#6B568F}.ev.cancelada{text-decoration:line-through;opacity:.5}
/* modal */
.ov{position:fixed;inset:0;background:rgba(43,32,36,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--cream);border-radius:20px;padding:22px;max-width:620px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.modal h2{font-size:28px;margin-bottom:6px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:80;font-size:14px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 80% 10%,#DCEFF2,transparent 60%),var(--cream);padding:20px}
.login .card{max-width:340px;width:100%;text-align:center;padding:30px}
.login h1{font-size:36px}
.pin{display:flex;gap:10px;justify-content:center;margin:22px 0}
.pin i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
.pin i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:58px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
.bar{height:8px;background:var(--blush);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose)}
.chart{display:flex;gap:6px;align-items:flex-end;height:130px;padding-top:10px}
.chart div{flex:1;background:var(--rose);border-radius:6px 6px 0 0;position:relative;min-height:2px}
.chart div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.chart div:hover::after{content:attr(data-v);position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--ink);color:#fff;padding:1px 6px;border-radius:6px;white-space:nowrap}
.hint{font-size:13px;color:var(--muted)}

/* ═══ ANIMACIONES CRM ═══ */
:root{--ease:cubic-bezier(.16,1,.3,1)}
main>*{animation:vIn .55s var(--ease) both}
main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(5){animation-delay:.24s}
@keyframes vIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.k4>.card{animation:vIn .6s var(--ease) both}
.k4>.card:nth-child(2){animation-delay:.07s}.k4>.card:nth-child(3){animation-delay:.14s}.k4>.card:nth-child(4){animation-delay:.21s}
.card{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.kpi:hover{transform:translateY(-4px);box-shadow:0 20px 40px -26px rgba(10,38,56,.5)}
.li{animation:liIn .45s var(--ease) both}
.li:nth-child(2){animation-delay:.05s}.li:nth-child(3){animation-delay:.1s}.li:nth-child(4){animation-delay:.15s}.li:nth-child(5){animation-delay:.2s}.li:nth-child(n+6){animation-delay:.25s}
@keyframes liIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
tbody tr{animation:liIn .4s var(--ease) both}
.btn{position:relative;overflow:hidden;isolation:isolate;transition:color .3s,transform .15s}
.btn::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .42s var(--ease)}
.btn:not(.p):not(.r):not(.wa):not(.d):hover{color:#fff}
.btn:hover::before{transform:scaleX(1)}
.btn.p::before{background:#123b52}.btn.r::before{background:var(--rose2)}.btn.wa::before{background:#1da851}.btn.d::before{background:var(--bad)}
.btn.d:hover{color:#fff}
.btn:active{transform:scale(.96)}
aside nav button{transition:background .3s,color .3s,transform .2s}
aside nav button:hover{background:rgba(255,255,255,.06)}
aside nav button.on{box-shadow:inset 3px 0 0 var(--gold)}
@media(max-width:820px){aside nav button.on{box-shadow:inset 0 -2px 0 var(--gold)}}
aside nav button .c{animation:badge 2s ease-in-out infinite}
@keyframes badge{50%{transform:scale(1.15)}}
.prod{transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.prod:hover{transform:translateY(-3px);box-shadow:0 14px 30px -20px rgba(10,38,56,.5)}
.prod:active{transform:scale(.95)}
.cl{animation:liIn .35s var(--ease) both}
.tot span:last-child{display:inline-block;animation:tick .4s var(--ease)}
@keyframes tick{from{transform:translateY(-6px);opacity:.3}}
.ov{animation:fadeO .25s ease both}
@keyframes fadeO{from{opacity:0}}
.modal{animation:mIn .45s var(--ease) both}
@keyframes mIn{from{opacity:0;transform:translateY(24px) scale(.97)}}
.toast{animation:tIn .45s var(--ease) both}
@keyframes tIn{from{opacity:0;transform:translate(-50%,20px)}}
.bar i{animation:grow 1s var(--ease) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.chart div{animation:up .9s var(--ease) both;transform-origin:bottom}
.chart div:nth-child(n){animation-delay:calc(var(--i,0)*40ms)}
@keyframes up{from{transform:scaleY(0)}}
.ev{transition:transform .2s,box-shadow .2s}.ev:hover{transform:translateX(3px);box-shadow:0 6px 14px -8px rgba(10,38,56,.4)}
.chip{transition:background .3s,color .3s,transform .2s}.chip:hover{transform:translateY(-2px)}
.login .card{animation:mIn .7s var(--ease) both}
.login img{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.pin i{transition:background .2s,transform .25s var(--ease)}
.pin i.f{transform:scale(1.25)}
.pin.err{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad button{transition:transform .12s,background .2s}.pad button:active{transform:scale(.92);background:var(--blush)}

/* ═══ MEJORAS CRM ═══ */
.goal-bar{height:10px;background:var(--blush);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.goal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E7C77A);border-radius:99px;animation:grow 1.2s var(--ease) both;transform-origin:left}
.card h3 .pill{font:500 12px Jost,sans-serif}
.up{color:var(--ok)}.down{color:var(--bad)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:8px 0}
.ph-grid figure{position:relative;border-radius:12px;overflow:hidden;background:var(--blush);aspect-ratio:1/1}
.ph-grid img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.ph-grid figcaption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(10,38,56,.8));color:#fff;font-size:11px;padding:14px 6px 4px}
.ph-grid .del{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(255,255,255,.9);cursor:pointer;font-size:12px}
.corte td:last-child,.corte th:last-child{text-align:right}
@media print{body>*:not(.ov){display:none!important}.ov{position:static;background:none;padding:0;animation:none}.modal{box-shadow:none;max-width:none;animation:none}.acts,.noprint{display:none!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="../data.js"></script>
<script>
(function(){
'use strict';
var N=NEGOCIO,root=document.getElementById('root');
var $=function(s,el){return (el||document).querySelector(s)},$$=function(s,el){return [].slice.call((el||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var money=function(n){return '$'+Math.round(Number(n)||0).toLocaleString('es-MX')};
var pad=function(n){return String(n).padStart(2,'0')};
var dk=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var hm=function(m){return pad(Math.floor(m/60))+':'+pad(m%60)};
var uid=function(p){return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],MN=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var fdate=function(k){var d=new Date(k+'T00:00:00');return DN[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()]};
var today=function(){return dk(new Date())};
var addDays=function(k,n){var d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return dk(d)};

/* ── Almacenamiento local (por negocio). Usa el mismo cajón de citas que la web. ── */
var K=function(n){return 'bs:'+N.slug+':'+n};
function load(n,def){try{var v=JSON.parse(localStorage.getItem(K(n)));return v==null?def:v}catch(e){return def}}
function save(n,v){try{localStorage.setItem(K(n),JSON.stringify(v))}catch(e){toast('No se pudo guardar (almacenamiento lleno o bloqueado)')}}
var DB={};
function loadAll(){
  DB.clientes=load('clientes',[]);DB.citas=load('citas',[]);DB.ventas=load('ventas',[]);DB.paquetes=load('paquetes',[]);DB.seg=load('seguimientos',[]);
  DB.cat=load('catalogo',null)||CATALOGO.map(function(x){return Object.assign({},x)});
  DB.cfg=load('config',{});
}
function persist(){['clientes','citas','ventas','paquetes'].forEach(function(n){save(n,DB[n])});save('seguimientos',DB.seg);save('catalogo',DB.cat);save('config',DB.cfg)}
loadAll();
window.addEventListener('storage',function(e){if(e.key&&e.key.indexOf(K(''))===0){loadAll();render()}});

/* ── PIN (hash simple; seguridad básica de dispositivo, no de servidor) ── */
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
if(!DB.cfg.pin){DB.cfg.pin=hash(N.slug+':'+N.pinInicial);DB.cfg.usuario=N.duena||'Recepción';save('config',DB.cfg)}
if(N.duena&&(!DB.cfg.usuario||DB.cfg.usuario==='Recepción')){DB.cfg.usuario=N.duena;save('config',DB.cfg)}
var S={auth:sessionStorage.getItem(K('auth'))==='1',tab:location.hash.replace('#','')||'inicio',q:'',agendaRef:today(),filtroCita:'hoy',cart:[],cartCli:'',pago:'Efectivo',desc:0,segF:'pendientes'};

function toast(t){var el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove()},2400)}
function cat(id){return DB.cat.filter(function(x){return x.id===id})[0]}
function cli(id){return DB.clientes.filter(function(x){return x.id===id})[0]}
function cliByTel(t){t=String(t||'').replace(/\D/g,'').slice(-10);return t?DB.clientes.filter(function(x){return x.telefono===t})[0]:null}
function wa(tel,txt){return 'https://wa.me/52'+String(tel||'').replace(/\D/g,'').slice(-10)+'?text='+encodeURIComponent(txt)}
function svcNames(ids){return (ids||[]).map(function(i){var c=cat(i);return c?c.nombre:i}).join(', ')||'Valoración'}

/* Une citas que llegaron de la web (sin cliente) a la ficha de clienta por teléfono */
function syncWebCitas(){
  var ch=false;
  DB.citas.forEach(function(c){
    if(c.cliente)return;
    var x=cliByTel(c.telefono);
    if(!x&&c.telefono){x={id:uid('c'),nombre:c.nombre||'Sin nombre',telefono:String(c.telefono).replace(/\D/g,'').slice(-10),origen:c.origen||'web',alta:today(),piel:'',alergias:c.nota||'',notas:'',etiquetas:['nueva']};DB.clientes.push(x)}
    if(x){c.cliente=x.id;ch=true}
  });
  if(ch)persist();
}

/* ── Iconos ── */
var I={
  inicio:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  agenda:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
  clientes:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-4-6"/>',
  venta:'<path d="M6 6h15l-2 9H8zM6 6L5 2H2M9 20a1 1 0 1 0 0-.01M18 20a1 1 0 1 0 0-.01"/>',
  seguimiento:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
  reportes:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',

function countUp(m){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;$$('.cnt',m).forEach(function(n){var txt=n.textContent,num=+txt.replace(/[^\d.]/g,'');if(!num)return;var pre=txt.charAt(0)==='$'?'$':'',t0=null;(function st(ts){if(!t0)t0=ts;var p=Math.min((ts-t0)/900,1),e=1-Math.pow(1-p,4),v=Math.round(e*num);n.textContent=pre+v.toLocaleString('es-MX');if(p<1)requestAnimationFrame(st);else n.textContent=txt})(performance.now())})}

/* ── SEGUIMIENTO (postventa y reactivación) ── */
function segPendientes(){
  var t=today();
  var base=DB.seg.filter(function(s){return !s.hecho&&s.fecha<=addDays(t,3)});
  // cumpleaños de la semana
  DB.clientes.forEach(function(c){if(!c.cumple)return;var md=c.cumple.slice(5),y=t.slice(0,4),f=y+'-'+md;if(f<t)f=(+y+1)+'-'+md;
    if(f<=addDays(t,7)&&!DB.seg.some(function(s){return s.cliente===c.id&&s.tipo==='cumple'&&s.fecha===f}))base.push({id:'cumple-'+c.id+'-'+f,cliente:c.id,fecha:f,motivo:'🎂 Cumpleaños: regálale 15% de descuento',tipo:'cumple',virtual:true})});
  // paquetes sin usar en 21 días
  DB.paquetes.forEach(function(p){if(p.usadas>=p.sesiones)return;var u=(p.usos||[]).slice(-1)[0]||p.compra;if(u<=addDays(t,-21)&&!DB.seg.some(function(s){return s.paquete===p.id&&!s.hecho}))base.push({id:'pk-'+p.id,cliente:p.cliente,fecha:addDays(u,21),motivo:'Le quedan '+(p.sesiones-p.usadas)+' sesiones de '+p.nombre,paquete:p.id,virtual:true})});
  return base.filter(function(s){return cli(s.cliente)}).sort(function(a,b){return a.fecha.localeCompare(b.fecha)});
}

  if(/^Retoque/.test(s.motivo))return 'Hola '+n+' ✨ ya se cumplen 15 días de tu aplicación: te esperamos para tu retoque incluido. ¿Qué día te acomoda?';
  if(/post-valoración/.test(s.motivo))return 'Hola '+n+' ✨ gracias por tu valoración en BeautySkin. Recuerda que tus $300 se descuentan de tu tratamiento. ¿Te apartamos fecha?';
  if(/^Revisión/.test(s.motivo))return 'Hola '+n+' ✨ ¿cómo te sientes con tu '+s.motivo.replace('Revisión de ','')+'? Si quieres, agendamos una revisión rápida con la doctora 💕';
