<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Organigrama de la Sección · IMSS</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Árbol vertical: Sección → Unidades (tarjetas) → Áreas → Categorías con plazas. Datos en vivo desde Google Sheets. */
:root{
  --bg:#f3f5f4; --surface:#fff; --ink:#17201d; --muted:#5b6964; --line:#d3dbd8;
  --accent:#0f5e47; --accent-soft:#e1efe9; --gold:#a5832b;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111715; --surface:#19211e; --ink:#e6ece9; --muted:#9aa8a3; --line:#2c3833;
  --accent:#5cc49f; --accent-soft:#1f3229; --gold:#d4b25c; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.eyebrow{font:700 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
h1{font:800 clamp(24px,5vw,34px)/1.1 var(--f-display);margin:4px 0 0;text-wrap:balance}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
select,input{font:15px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 200px}
.status{margin:0;font:600 13px var(--f-body);color:var(--muted)}
.root{align-self:center;text-align:center;background:var(--accent);color:var(--surface);border-radius:10px;padding:12px 24px;font:800 18px var(--f-display)}
.root small{display:block;font:600 13px var(--f-body);opacity:.85}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:16px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.unit-head{display:flex;gap:8px;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--accent);padding-bottom:8px}
.unit-head h2{font:800 20px var(--f-display);margin:0;min-width:0}
.tot{font:600 13px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.area{border-left:3px solid var(--gold);padding-left:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.area h3{font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.cats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.cat{display:flex;align-items:baseline;gap:6px;background:var(--accent-soft);border-radius:6px;padding:5px 8px}
.cat .n{flex:1;min-width:0}
.cat .obs{display:block;font-size:13px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;max-width:65ch}
.empty h2{font:800 18px var(--f-display);margin:0 0 6px}
.empty p{margin:0 0 8px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">IMSS · Movimiento de personal</div>
      <h1>Organigrama general de la Sección</h1>
    </div>
    <div class="tools">
      <a class="btn primary" id="editLink" target="_blank" rel="noopener">Editar en Google Sheets</a>
      <button class="btn" id="reload" type="button">Actualizar</button>
    </div>
  </header>
  <div class="filters">
    <select id="fUnit" aria-label="Filtrar por unidad"><option value="">Todas las unidades</option></select>
    <input id="fText" type="search" placeholder="Buscar categoría o área…" aria-label="Buscar">
  </div>
  <p class="status" id="status" role="status">Cargando datos…</p>
  <div class="root"><span>Sección</span><small id="secTot"></small></div>
  <div class="units" id="units"></div>
</div>
<script>
// Hoja de Google con columnas: Unidad | Área | Categoría | Plazas | Observaciones
const SHEET_ID='16QD3NgApmb6attva-SLUSRvqVVTdEAsZjfNo4K7n6FQ';
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
const $=id=>document.getElementById(id);
$('editLink').href=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
let rows=[];

function parseCSV(t){
  const out=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);out.push(row);row=[];f=''}
    else f+=c;
  }
  if(f||row.length){row.push(f);out.push(row)}
  return out;
}
const num=v=>parseInt(String(v).replace(/[^\d]/g,''),10)||0;
const el=(t,cls,txt)=>{const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};

async function load(){
  $('status').textContent='Cargando datos…';
  try{
    const r=await fetch(CSV_URL+'&t='+Date.now());
    const txt=await r.text();
    if(!r.ok||txt.trim().startsWith('<'))throw new Error('privada');
    const data=parseCSV(txt).filter(r=>r.some(c=>c.trim()));
    const head=data.shift().map(h=>h.trim().toLowerCase());
    const ix=k=>head.findIndex(h=>h.startsWith(k));
    const [iu,ia,ic,ip,io]=[ix('unidad'),ix('área')>=0?ix('área'):ix('area'),ix('categor'),ix('plaza'),ix('observ')];
    rows=data.map(r=>({u:(r[iu]||'').trim()||'Sin unidad',a:(r[ia]||'').trim()||'Sin área',c:(r[ic]||'').trim(),p:ip>=0?(r[ip]||'').trim():'',o:io>=0?(r[io]||'').trim():''})).filter(r=>r.c);
    fillUnits();render();
    $('status').textContent=`Datos de Google Sheets · actualizado ${new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}`;
  }catch(e){
    rows=[];render();
    $('units').innerHTML='';
    const b=el('div','empty');
    b.append(el('h2',null,'No se pudo leer la hoja'),
      el('p',null,'La hoja de Google tiene que estar compartida como "Cualquier persona con el enlace". En la hoja: Compartir → Acceso general → Cualquier persona con el enlace.'),
      el('p',null,'Si ya está compartida, revisa tu conexión y pulsa Actualizar.'));
    $('units').append(b);
    $('status').textContent='Sin datos';
  }
}
function fillUnits(){
  const s=$('fUnit'),cur=s.value;
  s.length=1;
  [...new Set(rows.map(r=>r.u))].forEach(u=>s.append(new Option(u,u)));
  s.value=[...s.options].some(o=>o.value===cur)?cur:'';
}
function render(){
  const fu=$('fUnit').value,ft=$('fText').value.trim().toLowerCase();
  const vis=rows.filter(r=>(!fu||r.u===fu)&&(!ft||(r.c+' '+r.a+' '+r.u).toLowerCase().includes(ft)));
  const allUnits=new Set(rows.map(r=>r.u)).size,tot=rows.reduce((s,r)=>s+num(r.p),0);
  $('secTot').textContent=`${allUnits} unidad${allUnits===1?'':'es'}`+(tot?` · ${tot} plazas`:'');
  const tree=new Map();
  vis.forEach(r=>{if(!tree.has(r.u))tree.set(r.u,new Map());const A=tree.get(r.u);if(!A.has(r.a))A.set(r.a,[]);A.get(r.a).push(r)});
  const box=$('units');box.innerHTML='';
  if(rows.length&&!vis.length){box.append(el('p','status','Sin resultados para ese filtro.'));return}
  tree.forEach((areas,u)=>{
    const card=el('section','unit'),head=el('div','unit-head');
    const ut=[...areas.values()].flat().reduce((s,r)=>s+num(r.p),0);
    head.append(el('h2',null,u),el('span','tot',ut?`${ut} plazas`:''));
    const grid=el('div','areas');
    areas.forEach((cats,a)=>{
      const ar=el('div','area'),h=el('h3');
      const at=cats.reduce((s,r)=>s+num(r.p),0);
      h.append(el('span',null,a),el('span','tot',at||''));
      const ul=el('ul','cats');
      cats.forEach(r=>{
        const li=el('li','cat'),n=el('span','n',r.c);
        if(r.o)n.append(el('span','obs',r.o));
        li.append(n);if(r.p)li.append(el('span','tot',r.p));ul.append(li);
      });
      ar.append(h,ul);grid.append(ar);
    });
    card.append(head,grid);box.append(card);
  });
}
$('reload').onclick=load;
$('fUnit').onchange=render;
$('fText').oninput=render;
load();
</script>
</body>
</html>
