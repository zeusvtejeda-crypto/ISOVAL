<svg xmlns="http://www.w3.org/2000/svg" width="6000mm" height="3000mm" viewBox="0 0 6000 3000"
     font-family="'Anton','Archivo Black','Arial Black',Impact,sans-serif">
  <title>Lona libramiento 6 × 3 m — Bases Box Tepic (versión B: A LA MEDIDA / +8 TONOS)</title>
  <!-- MEDIDA REAL: 600 × 300 cm · 1 unidad = 1 mm · área segura 250 mm por lado
       Dobladillo + ojillos cada 50 cm · textos a curvas antes de imprimir -->

  <rect width="6000" height="3000" fill="#F4F2ED"/>
  <rect width="6000" height="60" fill="#F2591F"/>
  <rect y="2940" width="6000" height="60" fill="#F2591F"/>

  <!-- marca -->
  <g transform="translate(680,150) scale(1.15)">
    <g fill="#F2591F">
      <polygon points="-103.9,190 -83.9,201.5 -83.9,214 -103.9,202.5"/>
      <polygon points="103.9,190 83.9,201.5 83.9,214 103.9,202.5"/>
      <rect x="-6" y="250" width="12" height="12"/>
    </g>
    <polygon points="103.9,60 0,120 0,250 103.9,190" fill="#2A2A2A"/>
    <polygon points="-103.9,60 0,120 0,250 -103.9,190" fill="#1A1A1A"/>
    <g transform="matrix(103.9,60,0,130,-103.9,60)"><text x="0.20" y="0.76" font-size="0.9" fill="#F4F2ED">B</text></g>
    <polygon points="0,0 103.9,60 0,120 -103.9,60" fill="#ECEAE4" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text x="960" y="500" font-size="300" fill="#1A1A1A" letter-spacing="6">BASES BO<tspan fill="#F2591F">X</tspan></text>
  <text x="966" y="640" font-size="130" fill="#3E4A54" letter-spacing="26"
        font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-weight="700">TEPIC · FÁBRICA PROPIA</text>

  <!-- mensaje -->
  <text x="3000" y="1330" font-size="620" fill="#1A1A1A" letter-spacing="8" text-anchor="middle">A LA MEDIDA</text>
  <text x="3000" y="1980" font-size="700" fill="#F2591F" letter-spacing="8" text-anchor="middle">+8 TONOS</text>

  <!-- muestrario de tonos -->
  <g stroke="#1A1A1A" stroke-width="10">
    <circle cx="1200" cy="2270" r="130" fill="#6F4E37"/>
    <circle cx="1720" cy="2270" r="130" fill="#6B3FA0"/>
    <circle cx="2240" cy="2270" r="130" fill="#E84E8A"/>
    <circle cx="2760" cy="2270" r="130" fill="#8A8D8F"/>
    <circle cx="3280" cy="2270" r="130" fill="#2E5AAC"/>
    <circle cx="3800" cy="2270" r="130" fill="#1E2A52"/>
    <circle cx="4320" cy="2270" r="130" fill="#39A85B"/>
    <circle cx="4840" cy="2270" r="130" fill="#1A1A1A"/>
  </g>

  <!-- contacto -->
  <rect x="0" y="2430" width="6000" height="450" fill="#1A1A1A"/>
  <g transform="translate(430,2520) scale(11)">
    <path fill="#F2591F" d="M12 2a10 10 0 00-8.6 15l-1.3 4.9 5-1.3A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1112 20zm4.6-6c-.3-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.6 0a6.5 6.5 0 01-3.2-2.8c-.2-.4.2-.4.6-1.2a.4.4 0 000-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.7 11.7 0 004.5 4c.6.3 1.1.4 1.5.5a3.5 3.5 0 001.6.1c.5-.1 1.5-.6 1.7-1.2s.2-1.1.1-1.2-.2-.2-.5-.3z"/>
  </g>
  <text x="3000" y="2750" font-size="380" fill="#F4F2ED" letter-spacing="8" text-anchor="middle">311 121 6033</text>
</svg>
