# Publicación como Worker (en vez de Pages): sirve el mismo dist/_worker.js, con la API y la app.
# Uso:  npx wrangler@4 deploy -c wrangler.worker.toml
# También lo usa Cloudflare para publicar solo cada cambio de la rama (comando: npx wrangler deploy -c wrangler.worker.toml).
name = "bases-box-inventario"
main = "dist/_worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "bases-box-inventario"
# Id de la base de esta instalación (no es un secreto; sin la cuenta de Cloudflare no sirve de nada)
database_id = "222613f3-26ed-49ae-9696-662d9cf5a3a0"
