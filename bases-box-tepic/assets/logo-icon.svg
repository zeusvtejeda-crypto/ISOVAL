<svg xmlns="http://www.w3.org/2000/svg" width="320" height="300" viewBox="-120 -20 240 300">
  <!-- feet (orange) -->
  <g fill="#F2591F">
    <polygon points="-103.9,190 -83.9,201.5 -83.9,214 -103.9,202.5"/>
    <polygon points="103.9,190 83.9,201.5 83.9,214 103.9,202.5"/>
    <rect x="-6" y="250" width="12" height="12"/>
  </g>
  <!-- right face -->
  <polygon points="103.9,60 0,120 0,250 103.9,190" fill="#2A2A2A"/>
  <!-- left face (carries B) -->
  <polygon points="-103.9,60 0,120 0,250 -103.9,190" fill="#1A1A1A"/>
  <!-- B mapped into the isometric plane -->
  <g transform="matrix(103.9,60,0,130,-103.9,60)">
    <text x="0.20" y="0.76" font-size="0.9" font-family="'Archivo Black','Arial Black',sans-serif" font-weight="900" fill="#F4F2ED">B</text>
  </g>
  <!-- top face (mattress) -->
  <polygon points="0,0 103.9,60 0,120 -103.9,60" fill="#ECEAE4" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#1A1A1A" opacity="0.55">
    <circle cx="0" cy="40" r="3"/><circle cx="-34" cy="60" r="3"/><circle cx="34" cy="60" r="3"/>
    <circle cx="0" cy="80" r="3"/><circle cx="0" cy="60" r="3.5"/>
  </g>
</svg>
